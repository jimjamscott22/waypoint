<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="'Public Sans',-apple-system,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="p-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b7c"/>
    </marker>
    <marker id="p-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3423a"/>
    </marker>
    <marker id="p-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1b1"/>
    </marker>
    <filter id="p-sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1c2734" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="880" fill="#ffffff"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#1c2734">Waypoint — Daily Ingestion Pipeline (C4 Container)</text>
  <text x="40" y="56" font-size="12.5" fill="#5c6b7c">One scrape run: take an advisory lock, fetch each enabled saved query from Adzuna, score and upsert matches, then record the outcome.</text>

  <!-- 1 timer -->
  <rect x="290" y="88" width="320" height="52" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="110" font-size="12.5" font-weight="700" fill="#1c2734" text-anchor="middle">1 · waypoint-scraper.timer — 06:00 daily</text>
  <text x="450" y="128" font-size="10.5" fill="#3d4c5d" text-anchor="middle">Persistent=true — a missed run fires on next boot</text>

  <!-- manual trigger -->
  <rect x="648" y="88" width="232" height="52" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="764" y="110" font-size="11.5" font-weight="700" fill="#1c2734" text-anchor="middle">or POST /api/scrape-runs</text>
  <text x="764" y="128" font-size="10" fill="#3d4c5d" text-anchor="middle">manual — 15-min cooldown → 429</text>

  <!-- 2 -->
  <rect x="290" y="164" width="320" height="52" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="186" font-size="12.5" font-weight="700" fill="#1c2734" text-anchor="middle">2 · server/cli/scrape.js → createServices()</text>
  <text x="450" y="204" font-size="10.5" fill="#3d4c5d" text-anchor="middle">verifyDatabase() — refuses MariaDB older than 10.6</text>

  <!-- 3 lock -->
  <rect x="290" y="240" width="320" height="52" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="262" font-size="12.5" font-weight="700" fill="#1c2734" text-anchor="middle">3 · GET_LOCK('waypoint:scrape', 0)</text>
  <text x="450" y="280" font-size="10.5" fill="#3d4c5d" text-anchor="middle">non-blocking — one run at a time, cluster-wide</text>

  <rect x="648" y="240" width="232" height="52" rx="10" fill="#f8cecc" stroke="#b3423a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="764" y="262" font-size="10.5" font-weight="600" fill="#b3423a" text-anchor="middle">not acquired → 409</text>
  <text x="764" y="279" font-size="10" fill="#5c6b7c" text-anchor="middle">RUN_IN_PROGRESS, nothing written</text>

  <!-- 4 -->
  <rect x="290" y="316" width="320" height="48" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="337" font-size="12" font-weight="700" fill="#1c2734" text-anchor="middle">4 · recoverStale(&gt; 30 min)</text>
  <text x="450" y="354" font-size="10" fill="#3d4c5d" text-anchor="middle">closes out runs abandoned by a crash</text>

  <!-- 5 -->
  <rect x="290" y="388" width="320" height="48" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="409" font-size="12" font-weight="700" fill="#1c2734" text-anchor="middle">5 · queryRepository.list({ enabledOnly: true })</text>
  <text x="450" y="426" font-size="10" fill="#3d4c5d" text-anchor="middle">run row created with status 'running'</text>

  <!-- loop container -->
  <rect x="258" y="456" width="384" height="216" rx="12" fill="none" stroke="#82b366" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="272" y="476" font-size="11" font-weight="700" fill="#1f8a5b">6 · for each enabled saved query</text>

  <rect x="290" y="486" width="320" height="48" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="450" y="506" font-size="11.5" font-weight="700" fill="#1c2734" text-anchor="middle">adzunaClient.search(query)</text>
  <text x="450" y="523" font-size="10" fill="#3d4c5d" text-anchor="middle">≤3 attempts · honors Retry-After · 15s timeout</text>

  <rect x="290" y="548" width="320" height="48" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="450" y="568" font-size="11.5" font-weight="700" fill="#1c2734" text-anchor="middle">normalize → drop malformed → filter by age</text>
  <text x="450" y="585" font-size="10" fill="#3d4c5d" text-anchor="middle">isWithinAgeLimit(query.maxAgeDays)</text>

  <rect x="290" y="610" width="320" height="48" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"/>
  <text x="450" y="630" font-size="11.5" font-weight="700" fill="#1c2734" text-anchor="middle">withTransaction → upsertListingMatch</text>
  <text x="450" y="647" font-size="10" fill="#3d4c5d" text-anchor="middle">scoreListing() per listing · counts new matches</text>

  <!-- scoring note -->
  <rect x="662" y="486" width="218" height="110" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"/>
  <text x="771" y="509" font-size="11" font-weight="700" fill="#1c2734" text-anchor="middle">scoreListing()</text>
  <text x="771" y="528" font-size="10" fill="#3d4c5d" text-anchor="middle">70 × keyword coverage (title)</text>
  <text x="771" y="544" font-size="10" fill="#3d4c5d" text-anchor="middle">+ 20 × coverage (description)</text>
  <text x="771" y="560" font-size="10" fill="#3d4c5d" text-anchor="middle">+ 10 × recency</text>
  <text x="771" y="580" font-size="9.5" fill="#93a1b1" text-anchor="middle">stop-words, stemming, prefix match</text>

  <!-- failure note -->
  <rect x="30" y="548" width="208" height="86" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1.4"/>
  <text x="134" y="571" font-size="10.5" font-weight="700" fill="#1c2734" text-anchor="middle">a failed query is recorded,</text>
  <text x="134" y="587" font-size="10.5" font-weight="700" fill="#1c2734" text-anchor="middle">the loop continues</text>
  <text x="134" y="606" font-size="9.5" fill="#5c6b7c" text-anchor="middle">error text passes through</text>
  <text x="134" y="620" font-size="9.5" fill="#5c6b7c" text-anchor="middle">sanitizeError() — keys redacted</text>

  <!-- 7 -->
  <rect x="290" y="692" width="320" height="48" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="713" font-size="12" font-weight="700" fill="#1c2734" text-anchor="middle">7 · listings.expire(&gt; 30 days)</text>
  <text x="450" y="730" font-size="10" fill="#3d4c5d" text-anchor="middle">unseen listings flip to status 'expired'</text>

  <!-- 8 -->
  <rect x="290" y="764" width="320" height="52" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#p-sh)"/>
  <text x="450" y="786" font-size="12" font-weight="700" fill="#1c2734" text-anchor="middle">8 · runRepository.finish(status)</text>
  <text x="450" y="804" font-size="10" fill="#3d4c5d" text-anchor="middle">all ok → success · some → partial · none → failed</text>

  <!-- 9 -->
  <rect x="290" y="838" width="320" height="34" rx="9" fill="#e8effc" stroke="#2f6fdb" stroke-width="2"/>
  <text x="450" y="860" font-size="11.5" font-weight="700" fill="#2f6fdb" text-anchor="middle">9 · RELEASE_LOCK — in finally, always runs</text>

  <!-- edges -->
  <path d="M450,140 L450,160" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M648,114 L620,114 L620,150 L450,150" fill="none" stroke="#6c8ebf" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M450,216 L450,236" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M610,266 L644,266" fill="none" stroke="#b3423a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p-red)"/>
  <path d="M450,292 L450,312" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,364 L450,384" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,436 L450,482" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,534 L450,544" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,596 L450,606" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,672 L450,688" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,740 L450,760" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M450,816 L450,834" fill="none" stroke="#5c6b7c" stroke-width="2" marker-end="url(#p-ar)"/>
  <path d="M290,572 L242,572" fill="none" stroke="#93a1b1" stroke-width="1.4" marker-end="url(#p-m)"/>
  <path d="M610,510 L658,510" fill="none" stroke="#93a1b1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p-m)"/>
</svg>
